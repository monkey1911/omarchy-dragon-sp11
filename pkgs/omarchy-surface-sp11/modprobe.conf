# Surface Pro 11: use the Surface (SAM) battery driver, not qcom_battmgr.
# Both report the same battery; the SAM driver also reports cycle count and
# serial number. Recommended by the Surface Pro 11 archiso project
# (dwhinham/archiso-aarch64-sp11, "Post-install fixups").
# Installed by omarchy-surface-sp11; to undo, create
# /etc/modprobe.d/omarchy-surface-sp11.conf containing nothing but a comment.
blacklist qcom_battmgr
