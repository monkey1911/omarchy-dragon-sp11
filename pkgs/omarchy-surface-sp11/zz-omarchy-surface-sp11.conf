# Surface Pro 11 (Snapdragon X, denali) initramfs additions.
# Installed by omarchy-surface-sp11. The zz- prefix sorts after Omarchy's
# omarchy_hooks.conf and after the surface_device_modules.conf that Omarchy's
# fix-surface-keyboard.sh writes, so the += below extends whatever list those
# built and the filter further down cleans it up.
#
# Adapted from omarchy-surface-sl7 (qBitnaut/omarchy-dragon-sl7, MIT).

# Flex Keyboard (Surface Aggregator Module), display (msm + clocks + eDP PHY +
# panel), USB-C DP alt mode, qrtr, I2C HID. Every entry is optional ("?"):
# mkinitcpio skips a module the kernel does not have, so the stock
# linux-aarch64 rescue UKI still builds. Names checked against the
# linux-sp11 7.2.11 config (all =m). ath12k is deliberately absent: it probes
# before its firmware is reachable in the initramfs and does not retry.
MODULES+=(
  surface_aggregator? surface_aggregator_registry? surface_aggregator_hub?
  surface_hid_core? surface_hid? surface_kbd?
  msm? dispcc-x1e80100? gpucc-x1e80100? phy-qcom-edp? panel-edp?
  ps883x? pmic_glink? pmic_glink_altmode? ucsi_glink?
  qrtr? i2c-hid-of? leds_qcom_lpg?
)

# Omarchy's fix-surface-keyboard.sh (x86 Surface support) also fires on the
# Surface Pro 11 and writes
#   MODULES=(<pinctrl_*> surface_* surface_kbd intel_lpss_pci 8250_dw)
# intel_lpss_pci does not exist on arm64, 8250_dw is built into linux-sp11,
# pinctrl_* are not needed early, and surface_kbd is missing from the stock
# linux-aarch64 rescue kernel. Drop the first three groups, make every
# remaining entry optional, and drop duplicates ("name" and "name?" count as
# the same module).
_sp11_modules=()
_sp11_names=()
for _sp11_m in "${MODULES[@]}"; do
  _sp11_n=${_sp11_m%\?}
  case $_sp11_n in
    intel_lpss_pci | 8250_dw | pinctrl_*) continue ;;
  esac
  for _sp11_seen in "${_sp11_names[@]}"; do
    [[ $_sp11_seen == "$_sp11_n" ]] && continue 2
  done
  _sp11_names+=("$_sp11_n")
  _sp11_modules+=("$_sp11_n?")
done
MODULES=("${_sp11_modules[@]}")
unset _sp11_modules _sp11_names _sp11_m _sp11_n _sp11_seen

# GPU zap shader and gen70500 firmware. A plain FILES+= entry makes
# mkinitcpio fail when a file is absent or only present compressed, so a
# hook adds whichever variants exist.
HOOKS+=(sp11-firmware)
