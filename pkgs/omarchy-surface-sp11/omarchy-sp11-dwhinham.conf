# [dwhinham]: the Surface Pro 11 kernel (linux-sp11, linux-sp11-dtbs) and
# support packages from github.com/dwhinham/archlinux-repo, so kernel updates
# arrive with `omarchy update`. Included from /etc/pacman.conf above the other
# repositories; omarchy-sp11-repo-ensure keeps the Include line there.
# Signed with Dale Whinham's key (dwhinham-keyring).
[dwhinham]
SigLevel = Required DatabaseOptional
Server = https://github.com/dwhinham/archlinux-repo/releases/download/$arch
