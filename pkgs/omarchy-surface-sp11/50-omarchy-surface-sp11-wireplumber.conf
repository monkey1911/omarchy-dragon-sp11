# Surface Pro 11 speaker safety: keep the PipeWire "Pro Audio" profile off the
# built-in sound card. Pro Audio bypasses the UCM mixer setup that limits the
# speaker volume (there is no hardware speaker protection on X1 machines yet).
# WirePlumber never auto-selects pro-audio, but a stored or clicked selection
# is honoured, so this script overrides both.
# Adapted from omarchy-surface-sl7 (qBitnaut/omarchy-dragon-sl7, MIT).
wireplumber.components = [
  {
    name = omarchy-surface-sp11/guard-pro-audio.lua, type = script/lua
    provides = custom.omarchy-surface-sp11-guard-pro-audio
  }
]

wireplumber.profiles = {
  main = {
    custom.omarchy-surface-sp11-guard-pro-audio = required
  }
}
