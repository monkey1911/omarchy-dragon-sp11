# Surface Pro 11: kernel command line and UKI policy for limine-entry-tool.
# Installed by omarchy-surface-sp11.
#
# Omarchy's own drop-ins already supply quiet boot (omarchy-defaults.conf) and
# "clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.tpm2_wait=0"
# (qualcomm-snapdragon.conf), which match what the Surface Pro 11 archiso
# boots with. Only the Surface Pro 11 additions live here.
#
# console=tty0 keeps Plymouth and the disk unlock prompt on the built-in screen.
KERNEL_CMDLINE[default]+=" console=tty0"

# The Surface Pro 11 boots from a device tree, not ACPI. A bare
# "protocol: linux" entry carries no device tree, so the unified kernel image
# (which embeds the device trees, see update-uki-dtbs) is mandatory.
ENABLE_UKI=yes
