name: installer-iso

# Builds the Surface Pro 11 Omarchy installer ISO (aarch64/snapdragon) from
# the upstream commits pinned in upstream.lock, this repository's patches
# (installer/iso-patches) and packages (pkgs/), and the signed Surface Pro 11
# packages from Dale Whinham's [dwhinham] repository. The ISO never contains
# Microsoft or Qualcomm firmware.
#
# tools/build-iso.sh runs the same steps on your own machine.
#
# Adapted from omarchy-dragon-sl7's installer-iso.yml (qBitnaut, MIT).

on:
  push:
    paths:
      - 'installer/**'
      - 'pkgs/**'
      - 'tools/**'
      - 'upstream.lock'
      - '.github/workflows/installer-iso.yml'
  workflow_dispatch:

permissions:
  contents: read # the publish job raises this to write for the release upload

concurrency:
  group: installer-iso-${{ github.ref }}
  cancel-in-progress: true

env:
  # Arch Linux ARM build environment (omacom/omarchy-pkg-builder, aarch64),
  # pinned by digest. tools/build-iso.sh uses the same digest.
  BUILDER_IMAGE: ghcr.io/omacom/omarchy-pkg-builder@sha256:a0cedbe8fb2f15aa34217ddd8a74a5e12003dc442f16f1825ab2b9e023488a63

jobs:
  repo:
    name: Local package repository omarchy-sp11
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint scripts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck lua5.4
          shellcheck -x -P SCRIPTDIR -s bash -S warning installer/scripts/*.sh tools/build-iso.sh
          cd pkgs/omarchy-surface-sp11
          shellcheck -x -s bash -S warning -e SC2034,SC2154 \
            sp11-firmware update-uki-dtbs set-boot-order neutralize-surface-keyboard \
            omarchy-sp11-firmware omarchy-sp11-repo-ensure 10-omarchy-sp11-repo \
            omarchy-surface-sp11.install zz-omarchy-surface-sp11.conf PKGBUILD ../iptsd-sp11/PKGBUILD
          luac5.4 -p guard-pro-audio.lua
          cd "$GITHUB_WORKSPACE"
          if grep -rIn '[[:space:]]$' installer/scripts tools pkgs upstream.lock; then
            echo "trailing whitespace found" >&2
            exit 1
          fi

      - name: Load upstream.lock
        run: installer/scripts/lock-env.sh >> "$GITHUB_ENV"

      - name: Fetch the signed Surface Pro 11 packages from [dwhinham]
        run: installer/scripts/fetch-dwhinham.sh dl

      - name: Fetch pinned omarchy-pkgs and export its qcom-firmware-extract and linux-aarch64-pkgbase-shim PKGBUILDs
        run: |
          set -euo pipefail
          installer/scripts/fetch-upstreams.sh "$RUNNER_TEMP/up" omarchy-pkgs
          installer/scripts/export-pkgbuilds.sh "$RUNNER_TEMP/up/omarchy-pkgs" "$RUNNER_TEMP/upstream"

      - name: Build packages and create the repository
        run: |
          set -euo pipefail
          mkdir -p repo
          docker run --rm --platform linux/arm64 --user 0 \
            -v "$PWD/installer/scripts:/scripts:ro" \
            -v "$PWD/pkgs/omarchy-surface-sp11:/src/omarchy-surface-sp11:ro" \
            -v "$PWD/pkgs/iptsd-sp11:/src/iptsd-sp11:ro" \
            -v "$RUNNER_TEMP/upstream:/src/upstream:ro" \
            -v "$PWD/dl:/prebuilt:ro" \
            -v "$PWD/repo:/repo" \
            -e ARCHINSTALL_VERSION -e ARCHINSTALL_SHA256 \
            "$BUILDER_IMAGE" \
            bash /scripts/build-repo.sh

      - name: Guard against firmware in the repository
        run: installer/scripts/guard-artifacts.sh repo

      - name: Package versions
        run: |
          set -euo pipefail
          {
            cat dl/versions.txt
            for f in repo/omarchy-surface-sp11-*.pkg.tar.zst repo/iptsd-sp11-*.pkg.tar.zst; do
              b="$(basename "$f")"
              [[ $b =~ ^(.+)-([^-]+-[^-]+)-[^-]+\.pkg\.tar\.zst$ ]] && echo "${BASH_REMATCH[1]} ${BASH_REMATCH[2]}"
            done
          } | sort | tee package-versions.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omarchy-sp11-repo
          path: repo/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-versions
          path: package-versions.txt
          if-no-files-found: error
          retention-days: 14

  iso:
    name: Installer ISO (aarch64/snapdragon)
    needs: repo
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load upstream.lock
        run: installer/scripts/lock-env.sh >> "$GITHUB_ENV"

      - name: Runner facts
        run: |
          uname -a
          nproc
          free -h
          df -h
          docker info --format '{{.Driver}} {{.DockerRootDir}}'

      # Leave room for the offline package mirror and the ISO staging tree.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        continue-on-error: true

      - name: Fetch pinned upstreams
        run: |
          set -euo pipefail
          installer/scripts/fetch-upstreams.sh "$RUNNER_TEMP/build" omarchy-iso omarchy omarchy-pkgs

      - name: Download the repository artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omarchy-sp11-repo
          path: ${{ runner.temp }}/build/repo

      - name: Download the package versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-versions

      - name: Apply installer/iso-patches
        run: |
          set -euo pipefail
          # Artifact upload may have turned the links into copies. The extra
          # omarchy.db name is only there to satisfy omarchy-iso-make.
          cd "$RUNNER_TEMP/build/repo"
          ln -sf omarchy-sp11.db.tar.gz omarchy-sp11.db
          ln -sf omarchy-sp11.files.tar.gz omarchy-sp11.files
          ln -sf omarchy-sp11.db omarchy.db
          ls -l
          cd "$GITHUB_WORKSPACE"
          installer/scripts/apply-iso-patches.sh "$RUNNER_TEMP/build/omarchy-iso"

      - name: Build ISO
        working-directory: ${{ runner.temp }}/build/omarchy-iso
        run: |
          set -euo pipefail
          start=$(date +%s)
          ./bin/omarchy-iso-make --arch aarch64 --media-target aarch64/snapdragon --edge \
            --local-source ../omarchy ../omarchy-pkgs --local-repo ../repo \
            --keep-pkg-cache --no-boot-offer
          echo "ISO build wall-clock: $(( $(date +%s) - start ))s"
          ls -l release/

      - name: Assert ISO contents
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso squashfs-tools libarchive-tools
          isos=("$RUNNER_TEMP"/build/omarchy-iso/release/*.iso)
          [ "${#isos[@]}" = 1 ] || { echo "expected exactly one ISO, got ${#isos[@]}" >&2; exit 1; }
          installer/scripts/assert-iso.sh "${isos[0]}" "$RUNNER_TEMP/assert"

      - name: Checksum
        run: |
          set -euo pipefail
          mkdir -p out
          iso="$(ls "$RUNNER_TEMP"/build/omarchy-iso/release/*.iso)"
          mv "$iso" out/
          cd out
          sha256sum "$(basename "$iso")" | tee "$(basename "$iso").sha256"
          ls -lh
          {
            echo '### Installer ISO'
            echo
            echo '```'
            cat ./*.sha256
            echo '```'
            echo
            echo '| input | pin |'
            echo '|---|---|'
            echo "| omarchy | \`$OMARCHY_SHA\` |"
            echo "| omarchy-iso | \`$OMARCHY_ISO_SHA\` |"
            echo "| omarchy-pkgs | \`$OMARCHY_PKGS_SHA\` |"
            echo
            echo '| Surface Pro 11 package | version |'
            echo '|---|---|'
            while read -r n v; do echo "| $n | $v |"; done < "$GITHUB_WORKSPACE/package-versions.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omarchy-sp11-installer-iso
          path: out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Disk at end
        if: ${{ !cancelled() }}
        run: df -h

  publish:
    name: Publish to the installer-latest release
    needs: iso
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write # release upload and tag move (installer-latest)
    steps:
      - name: Download the ISO artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: omarchy-sp11-installer-iso
          path: out

      - name: Download the package versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-versions

      # GitHub release assets are limited to 2 GiB each and this ISO is larger,
      # so the release carries it as parts of 1900 MiB (cat them back together).
      # The release is edited in place on every successful main build and the
      # tag is moved to the commit that built it.
      - name: Publish the ISO to the installer-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: installer-latest
        run: |
          set -euo pipefail
          iso="$(basename "$(ls out/*.iso)")"
          mkdir -p rel
          split -b 1900M -d -a 2 "out/$iso" "rel/$iso.part-"
          cp "out/$iso.sha256" rel/
          (cd rel && sha256sum "$iso".part-* > "$iso.parts.sha256")
          ls -l rel
          size="$(stat -c %s "out/$iso")"
          pkgs="$(while read -r n v; do echo "- $n $v"; done < package-versions.txt)"
          cat > notes.md <<NOTES
          Omarchy installer ISO for the Microsoft Surface Pro 11 (Snapdragon X, aarch64), rebuilt by
          .github/workflows/installer-iso.yml on every change to main. This release is replaced by each build.

          Built from commit ${GITHUB_SHA} (workflow run ${GITHUB_RUN_ID}), $(date -u +%Y-%m-%d).

          **This ISO contains NO Microsoft or Qualcomm firmware.** The installer copies it from
          Windows before the disk is wiped, or run \`sudo omarchy-sp11-firmware\` after installing.

          The ISO is $size bytes, over GitHub's 2 GiB asset limit, so it is published in parts.
          Reassemble and check:

              cat ${iso}.part-* > ${iso}
              sha256sum -c ${iso}.sha256

          Surface Pro 11 packages on this ISO:
          $pkgs
          NOTES
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Surface Pro 11 installer ISO (latest)" --notes-file notes.md
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > have.txt
          # parts first, the checksums last
          for f in rel/*; do
            case "$f" in *.part-*) gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$f" ;; esac
          done
          for f in rel/*; do
            case "$f" in *.part-*) ;; *) gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$f" ;; esac
          done
          # drop assets of the previous build that this build does not have
          (cd rel && ls) | sort > want.txt
          comm -23 have.txt want.txt | while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "delete stale asset $f"
            gh release delete-asset "$TAG" "$f" -R "$GITHUB_REPOSITORY" -y
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Surface Pro 11 installer ISO (latest)" --notes-file notes.md
          {
            echo
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
